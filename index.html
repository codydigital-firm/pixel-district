<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WarehousePro Dashboard</title>

<link rel="stylesheet" href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        WarehousePro
    </div>

    <ul class="menu">
        <li>📊 Dashboard</li>
        <li>📦 Inventory</li>
        <li>🛒 eBay Auctions</li>
        <li>📱 Facebook Listings</li>
        <li>📢 Marketing</li>
        <li>📈 Analytics</li>
    </ul>

</div>

<div class="main">

    <div class="header">

        <h1>Inventory Dashboard</h1>

        <div class="header-actions">

            <button
                id="themeBtn"
                class="btn btn-secondary"
                onclick="toggleTheme()">
                🌙 Dark Mode
            </button>

            <button
                class="btn"
                onclick="addProduct()">
                Add Product
            </button>

        </div>

    </div>

    <div class="stats">

        <div class="card">
            <div class="card-label">
                Total Products
            </div>

            <div
                class="card-value"
                id="totalProducts">
            </div>
        </div>

        <div class="card">
            <div class="card-label">
                Inventory Units
