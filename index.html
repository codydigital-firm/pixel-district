<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Management Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>WarehousePro</h2>

    <ul>
        <li>Dashboard</li>
        <li>Inventory</li>
        <li>eBay Auctions</li>
        <li>Facebook Listings</li>
        <li>Marketing</li>
        <li>Analytics</li>
    </ul>
</div>

<div class="main">

    <div class="header">
        <h1>Inventory Dashboard</h1>
        <button onclick="showForm()">Add Product</button>
    </div>

    <div id="productForm" class="form hidden">
        <input id="sku" placeholder="SKU">
        <input id="name" placeholder="Product Name">
        <input id="qty" type="number" placeholder="Quantity">
        <input id="price" type="number" placeholder="Price">

        <button onclick="addProduct()">Save Product</button>
    </div>

    <div class="stats">
        <div class="card">
            <h3>Total Products</h3>
            <span id="totalProducts">0</span>
        </div>

        <div class="card">
            <h3>Total Inventory</h3>
            <span id="totalStock">0</span>
        </div>

        <div class="card">
            <h3>Active eBay Listings</h3>
            <span>12</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SKU</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="inventoryTable"></tbody>
    </table>

</div>

<script src="script.js"></script>

</body>
</html>
